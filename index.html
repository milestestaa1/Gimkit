<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gimkit Replica</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --accent: #0f3460;
            --highlight: #e94560;
            --text: #ffffff;
            --success: #4cc9f0;
            --gold: #ffd700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- LOBBY SCREEN --- */
        #lobby {
            text-align: center;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            width: 400px;
        }

        h1 {
            margin-bottom: 1rem;
            color: var(--highlight);
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid var(--accent);
            border-radius: 8px;
            background: var(--bg-color);
            color: white;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
        }

        input:focus {
            border-color: var(--highlight);
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: var(--highlight);
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.1s;
            font-weight: bold;
        }

        button:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }

        button:active {
            transform: scale(0.98);
        }

        /* --- GAME SCREEN --- */
        #game {
            display: none;
            width: 100%;
            height: 100vh;
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-template-rows: auto 1fr auto;
            gap: 10px;
            padding: 20px;
        }

        /* Header */
        .header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 20px;
            border-radius: 10px;
        }

        .money-display {
            font-size: 1.5rem;
            color: var(--gold);
            font-weight: bold;
        }

        .timer-display {
            font-size: 1.5rem;
            color: var(--success);
        }

        /* Question Area */
        .question-area {
            grid-column: 1 / 2;
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .question-text {
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        .answer-btn {
            background: var(--accent);
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.1rem;
            border: 2px solid transparent;
        }

        .answer-btn:hover
